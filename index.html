<style>
/* Layout: sticky header + segmented tabs, single column of stop cards, mobile first */
:root{
  color-scheme:light;
  --bg:#F7F8F6; --surface:#FFFFFF; --ink:#1A2520; --muted:#66756D; --line:#E3E8E4;
  --pine:#2C7A5B; --pine-soft:#E8F3EC; --gold:#A0802F; --gold-soft:#FAF3E1;
  --frost:#3F6D8E; --frost-soft:#EAF1F7; --warn:#A5531F; --warn-soft:#FBEDE3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:12px 4px}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.eyebrow{font:500 10px/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:700 16px/1.2 var(--f-display);margin:4px 0 8px}
.stats{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none}
.stat{font:500 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stat b{font:500 12px/1 var(--f-mono);margin-right:3px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{all:unset;cursor:pointer;text-align:center;font:600 12px/1 var(--f-body);padding:10px 2px;border-radius:9px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--pine);color:#FFFFFF}
.tabs button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
main{padding-top:8px;display:grid;gap:18px}
.start{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.start label{font:600 12px/1 var(--f-body);color:var(--muted)}
input[type=text],input[type=search]{width:100%;font:500 15px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.route{display:grid;gap:10px}
.rhead{display:grid;gap:8px}
.rtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rnum{font:700 13px/1 var(--f-display);color:var(--pine)}
.rtitle h2{font:700 17px/1.2 var(--f-display);margin:0}
.rdate{font:500 13px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 var(--f-body);padding:6px 8px;border-radius:7px}
.chip b{font-family:var(--f-mono);font-weight:500}
.c-pz{background:var(--gold-soft);color:var(--gold)}
.c-tr{background:var(--pine-soft);color:var(--pine)}
.c-cp{background:var(--frost-soft);color:var(--frost)}
.c-bx{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:600 14px/1 var(--f-body);padding:13px 14px;border-radius:11px;background:var(--pine);color:#FFFFFF;text-align:center}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--line);padding:10px 12px;font-size:13px}
.load{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.load b{color:var(--ink);font-weight:600}
.stops{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(26,37,32,.04)}
.stop.done{opacity:.6}
.stop summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:12px}
.stop summary::-webkit-details-marker{display:none}
.seq{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:500 13px var(--f-mono);background:var(--pine-soft);color:var(--pine)}
.stop.done .seq{background:var(--pine);color:#FFFFFF}
.sname{font:600 15px/1.25 var(--f-body);min-width:0}
.ssub{font-size:12.5px;color:var(--muted);margin-top:3px}
.caret{color:var(--muted);font-size:18px;line-height:30px;transition:transform .15s}
details[open] .caret{transform:rotate(90deg)}
.sbody{padding:0 12px 12px 56px;display:grid;gap:10px}
.zone{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:grid;gap:3px}
.zone.z-pz{border-color:var(--gold)} .zone.z-tr{border-color:var(--pine)} .zone.z-cp{border-color:var(--frost)} .zone.z-ot{border-color:var(--muted)}
.zt{font:600 14px/1.3 var(--f-body)}
.zw{font-size:12.5px;color:var(--muted)}
.zone ul{margin:2px 0 0;padding-left:16px;font-size:13px;display:grid;gap:1px}
.ref{font:500 11px var(--f-mono);color:var(--muted)}
.note{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--pine)}
.addr{font-size:12.5px;color:var(--muted);user-select:text}
.sec{display:grid;gap:8px}
.sec h2{font:700 15px/1.2 var(--f-display);margin:4px 0 2px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 12px;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0}
.row .v{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .k small{display:block;color:var(--muted);font-size:12px}
.row.total{background:var(--pine-soft)} .row.total .k,.row.total .v{color:var(--pine);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.when{font:500 12px/1.3 var(--f-mono);color:var(--pine)}
.step h3{font:600 14.5px/1.3 var(--f-body);margin:0 0 3px}
.step p{margin:0;font-size:13.5px;color:var(--muted)}
.q{counter-reset:q;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rbadge{font:500 11px var(--f-mono);color:var(--pine);background:var(--pine-soft);border-radius:6px;padding:3px 6px;white-space:nowrap}
.muted{color:var(--muted);font-size:13px;margin:0}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{all:unset;cursor:pointer;text-align:center;padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;gap:3px}
.days button b{font:500 14px/1 var(--f-mono)}
.days button span{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.days button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.depart{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.depart b{color:var(--ink);font:500 13px var(--f-mono)}
.crew{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.crew.a{border-top:4px solid var(--gold)} .crew.b{border-top:4px solid var(--pine)}
.crew .stop{background:var(--bg);box-shadow:none}
.ctag{font:600 11px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.crew.a .ctag{color:var(--gold)} .crew.b .ctag{color:var(--pine)}
.crew.a .seq{background:var(--gold-soft);color:var(--gold)}
.crew.a .stop.done .seq{background:var(--gold);color:#FFFFFF}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.prog-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prog .lbl{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prog .big{font:700 30px/1 var(--f-display);margin-top:6px}
.prog .big small{font:600 14px var(--f-body);color:var(--muted);margin-left:4px}
.prog .when2{font:500 12px/1.4 var(--f-mono);color:var(--muted);text-align:right}
.barrow{display:grid;gap:4px}
.barrow .bl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.barrow .bl b{font:500 12.5px var(--f-mono);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .3s}
.bar.a i{background:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{all:unset;cursor:pointer;text-align:center;font:600 13px/1 var(--f-body);padding:9px 4px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.m-mkad{fill:var(--pine-soft);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.m-ttk{fill:none;stroke:var(--line);stroke-width:1.5}
.m-sad{fill:var(--bg);stroke:var(--line);stroke-width:2}
.m-lbl{font:500 9.5px var(--f-body);fill:var(--muted)}
.m-name{font:600 10px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.r-a{fill:none;stroke:var(--gold);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.r-b{fill:none;stroke:var(--pine);stroke-width:2.6;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}
.mk-a{fill:var(--gold)} .mk-b{fill:var(--pine)} .mk-ghost{fill:var(--muted);fill-opacity:.35}
.mk-t{fill:#FFFFFF;font:600 9px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.mk-home{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:3px solid var(--gold)}
.legend i.b{border-top:3px dashed var(--pine)}
.legend i.h{width:10px;height:10px;border:0;border-radius:2px;background:var(--ink)}
.maplist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maplist ol{margin:0;padding-left:18px;font-size:13px;display:grid;gap:2px}
.maplist .ctag{display:block;margin-bottom:6px}
.maplist .a .ctag{color:var(--gold)} .maplist .b .ctag{color:var(--pine)}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pk.a{border-top:4px solid var(--gold)} .pk.b{border-top:4px solid var(--pine)}
.pk-h{padding:12px;display:grid;gap:8px}
.pk-g{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.pk-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.pk-row input{width:19px;height:19px;accent-color:var(--pine);margin:0}
.pk.a .pk-row input{accent-color:var(--gold)}
.pk-row .q{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pk-row.on .t{text-decoration:line-through;color:var(--muted)}
.pk-row .t small{display:block;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){.caret{transition:none}.bar i{transition:none}}
</style>
</head>

<div class="wrap">

  {date:"Вс 29.11",short:"29.11",dow:"Вс",win:2,iso:"2026-11-29",
   A:{title:"Запад и область",stops:["bagrat","mosfilm","zven"],tip:"Звенигородка последней: самый дальний адрес."},

];
const CREW = {A:"Бригада А · фотозоны",B:"Бригада Б · ели и композиции"};
function crewOf(z){return z.crew||((z.t==="pzr"||z.t==="pzc"||z.t==="garl")?"A":"B")}

const KIND = {pzr:"pz",pzc:"pz",tree:"tr",comp:"cp",garl:"ot",big:"ot",street:"tr"};

function zoneInfo(z){
  switch(z.t){
    case "pzr":return {title:"Фотозона прямоугольная",ref:"п. 2.1",items:[
      "Баннер «стена гостиной с лепниной» 2,5–3 × 2,2–2,5 м, хвоя по краю, шары, сосульки, гирлянда",

      "Рама барокко 0,9–1 × 1,8–2 м","Коробки — 12 шт.","Подсвечники — 3 шт.","Надпись (по согласованному макету)"]};
    case "pzc":return {title:"Фотозона круглая",ref:"п. 2.2",items:[
      "Круглый баннер с лепниной 2 × 2,2 м, хвоя по краю, шары, сосульки, гирлянда",
      "Ели 2–2,2 м и 1,6–1,8 м на подставках (по 1 шт.)","Рама барокко 1–1,2 × 1,8 м",
      "Коробки — 12 шт.","Подсвечники — 3 шт.","Надпись (по согласованному макету)"]};
    case "tree":return {title:"Ель "+z.h,ref:"п. 2.3",items:["Ель на подставке","Коробки под елью — 10 шт.","Надпись рядом с елью"]};
    case "comp":return {title:"Настольные композиции — "+z.n+" шт.",ref:"п. 2.4",items:["20 × 20 × 20 см, хвоя искусств./натур. 70/30"]};
    case "garl":return {title:"Хвойная гирлянда на лестницу, 15 м",ref:"п. 2.1.6",items:["Шары золотые, белые, перламутровые"]};
    case "big":return {title:"Украсить ель 6 м заказчика",ref:"п. 2.5",items:["Полный декор ели","Коробки — 30 шт.","Надпись рядом с елью"]};
    case "street":return {title:"Уличные ели 2,5–3 м — 2 шт.",ref:"п. 2.6",items:["Кашпо серые — 2 шт.","Тёплая гирлянда, свисающие огни-сосульки"]};
  }
}

function count(zones){
  const c={pz:0,trees:0,comp:0,boxes:0,text:0};
  zones.forEach(z=>{
    if(z.t==="pzr"||z.t==="pzc"){c.pz++;c.trees+=2;c.boxes+=12;c.text++}
    if(z.t==="tree"){c.trees++;c.boxes+=10;c.text++}
    if(z.t==="street"){c.trees+=2}
    if(z.t==="comp"){c.comp+=z.n}
    if(z.t==="big"){c.boxes+=30;c.text++}
  });
  return c;
}
function sum(arr){return arr.reduce((a,c)=>{for(const k in c)a[k]=(a[k]||0)+c[k];return a},{})}

function chips(c){
  const out=[];
  if(c.pz)out.push(`<span class="chip c-pz">Фотозоны <b>${c.pz}</b></span>`);
  if(c.trees)out.push(`<span class="chip c-tr">Ели <b>${c.trees}</b></span>`);
  if(c.comp)out.push(`<span class="chip c-cp">Композиции <b>${c.comp}</b></span>`);
  if(c.boxes)out.push(`<span class="chip c-bx">Коробки <b>${c.boxes}</b></span>`);
  return `<div class="chips">${out.join("")}</div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function mapUrl(addr){return "https://yandex.ru/maps/?text="+encodeURIComponent(addr)}

// storage helpers (per-phone only)
function get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

const visits={};DAYS.forEach(d=>["A","B"].forEach(c=>d[c].stops.forEach(s=>{(visits[s]=visits[s]||[]).push(d.short+" "+c)})));

function zonesHtml(loc,zones){
  zones=zones||loc.zones;
  return zones.map(z=>{const i=zoneInfo(z);return `<div class="zone z-${KIND[z.t]}">
    <div class="zt">${esc(i.title)} <span class="ref">${i.ref}</span></div>
    <div class="zw">${esc(z.w)}</div>
    <ul>${i.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}).join("")
    + (loc.note?`<div class="note">${esc(loc.note)}</div>`:"");
}
function shortSub(c){
  const p=[];if(c.pz)p.push(c.pz+" фотозон"+(c.pz>1?"ы":"а"));
  const lone=c.trees-c.pz*2; if(lone>0)p.push(lone+" "+(lone===1?"ель":"ели"));
  if(c.comp)p.push(c.comp+" композ.");
  return p.join(" · ");
}

    h+=`<article class="crew ${cr.toLowerCase()}">
      <div class="rhead">
        <span class="ctag">${CREW[cr]}</span>
        <div class="rtitle"><h2>${r.title}</h2><span class="rdate">${doneN}/${r.stops.length} готово</span></div>

        <p class="muted">С телефона в Яндексе едьте по точкам: кнопка «В Яндекс.Карты» в карточке каждого адреса.</p>
        <div class="load"><b>Грузить:</b> сначала то, что выгружаем последним — ${esc(loadOrder)}.${r.tip?"<br>"+esc(r.tip):""}</div>
      </div>
      <ol class="stops">${r.stops.map((s,i)=>{const L=LOCS[s],z=zs(s),cc=count(z),d=get(key(s),"0")==="1";
        const showNote=(s==="neg"&&cr==="B");
        return `<li><details class="stop${d?" done":""}" data-key="${key(s)}">
          <summary><span class="seq">${i+1}</span><div class="sname">${esc(L.name)}<div class="ssub">${shortSub(cc)}</div></div><span class="caret">›</span></summary>
          <div class="sbody">${chips(cc)}${zonesHtml(showNote?L:{},z)}
            <div class="addr">${esc(L.addr)}</div>
            <div class="actions"><a class="btn ghost" href="${mapUrl(L.addr)}" target="_blank" rel="noopener">В Яндекс.Карты ↗</a>
            <label class="check"><input type="checkbox" id="chk-${key(s)}" data-done="${key(s)}" ${d?"checked":""}> Смонтировано</label></div>
          </div></details></li>`}).join("")}</ol>
    </article>`;
  });
  h+=`<p class="muted">Демонтаж (16–17.01 и 23–24.01) — теми же маршрутами. Отметки «Смонтировано» сохраняются только на этом телефоне.</p>`;

// ---------- shared day state ----------
function curDay(){let d=+get("day","0");return (d>=0&&d<DAYS.length)?d:0}
function daysPills(di){return `<div class="days" role="group" aria-label="День монтажа">${DAYS.map((d,i)=>`<button type="button" data-day="${i}" aria-pressed="${i===di}"><b>${d.short}</b><span>${d.dow} · окно ${d.win}</span></button>`).join("")}</div>`}
function plural(n,a,b,c){const m=n%10,h=n%100;return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<12||h>14))?b:c}
function mskYmd(dt){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"}).format(dt)}
function mskStart(iso){return new Date(iso+"T08:00:00+03:00")}

// ---------- countdown + progress ----------
function crewStops(){const out=[];DAYS.forEach((d,di)=>["A","B"].forEach(cr=>d[cr].stops.forEach(s=>out.push({di,cr,s}))));return out}
function isDone(x){return get(`done2-${x.di}-${x.cr}-${x.s}`,"0")==="1"}
function bar(label,done,total,cls){const pct=total?Math.round(done/total*100):0;
  return `<div class="barrow"><div class="bl"><span>${label}</span><b>${done} / ${total}</b></div><div class="bar ${cls||""}"><i style="width:${pct}%"></i></div></div>`}
function progressCard(){
  const now=new Date(), today=mskYmd(now);
  const all=crewStops(), doneAll=all.filter(isDone).length;
  const ti=DAYS.findIndex(d=>d.iso===today);
  let lbl,big,side;
  const left=t=>{const ms=t-now;const d=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5);
    return d>=1?`${d}<small>${plural(d,"день","дня","дней")} ${hh} ч</small>`:`${hh}<small>ч ${Math.floor(ms%36e5/6e4)} мин</small>`};
  const w1=mskStart(DAYS[0].iso), w2=mskStart(DAYS[2].iso), dem=mskStart("2027-01-16");
  if(ti>=0&&now>=mskStart(DAYS[ti].iso)){lbl="Сегодня монтаж";big=DAYS[ti].date;side=`окно ${DAYS[ti].win}<br>выезд был в 8:00`}
  else if(now<w1){lbl="До монтажа";big=left(w1);side="Сб 21.11<br>выезд в 8:00"}
  else if(now<w2){lbl="До второго окна";big=left(w2);side="Сб 28.11<br>выезд в 8:00"}
  else if(now<dem){lbl="Монтаж завершён · до демонтажа";big=left(dem);side="Сб 16.01"}
  else {lbl="Демонтаж";big="16–24.01";side="теми же маршрутами"}
  let bars="";
  if(ti>=0){const d=DAYS[ti];["A","B"].forEach(cr=>{const st=d[cr].stops.map(s=>({di:ti,cr,s}));bars+=bar(CREW[cr],st.filter(isDone).length,st.length,cr==="A"?"a":"")})}
  bars+=bar("Весь монтаж, выездов",doneAll,all.length);
  return `<div class="prog"><div class="prog-top"><div><div class="lbl">${lbl}</div><div class="big">${big}</div></div><div class="when2">${side}</div></div>${bars}</div>`;
}
function refreshProg(){const el=document.getElementById("progCard");if(el)el.innerHTML=progressCard()}

// ---------- map ----------
const GEO={start:[55.884,37.603],neg:[55.7617,37.6213],selivers:[55.7697,37.6337],nastas:[55.7676,37.6036],kotel:[55.7473,37.6426],
  balchug:[55.7478,37.6263],zhitnaya:[55.7318,37.6143],mytnaya:[55.7278,37.6157],leninsky:[55.7293,37.6066],mira:[55.8000,37.6370],
  pravdy:[55.7867,37.5818],volok:[55.8180,37.4430],svobody:[55.8640,37.4360],mosfilm:[55.7300,37.5330],bagrat:[55.7430,37.4980],
  odin:[55.6780,37.2650],zven:[55.7000,37.2150]};
const SHORT={neg:"Неглинная",selivers:"Селиверстов",nastas:"Настасьинский",kotel:"Котельническая",balchug:"Балчуг",zhitnaya:"Житная",
  mytnaya:"Мытная",leninsky:"Ленинский",mira:"Пр. Мира",pravdy:"Правды",volok:"Волоколамское",svobody:"Свободы",mosfilm:"Мосфильмовская",
  bagrat:"Багратионовский",odin:"Одинцово",zven:"Звенигородка ← ~40 км"};
const VIEWS={
  all:{lon0:37.10,lon1:37.90,lat0:55.56,lat1:55.93,W:360,H:300},
  center:{lon0:37.572,lon1:37.66,lat0:55.722,lat1:55.807,W:360,H:420}};
function projector(v){const k=Math.cos(55.75*Math.PI/180);const xr=(v.lon1-v.lon0)*k,yr=v.lat1-v.lat0;const sc=Math.min(v.W/xr,v.H/yr);
  const ox=(v.W-xr*sc)/2,oy=(v.H-yr*sc)/2;
  return {p:(lat,lon)=>[ox+(lon-v.lon0)*k*sc,oy+(v.lat1-lat)*sc],rx:dl=>dl*k*sc,ry:dl=>dl*sc}}
function inView(v,id){const [la,lo]=GEO[id];return lo>=v.lon0&&lo<=v.lon1&&la>=v.lat0&&la<=v.lat1}
function renderMap(){
  const di=curDay(),day=DAYS[di],vk=get("mapv","all")==="center"?"center":"all";
  const usedIds=[...new Set([...day.A.stops,...day.B.stops])],central=usedIds.filter(id=>inView(VIEWS.center,id));
  let v=VIEWS[vk];
  if(vk==="center"&&central.length){const la=central.map(id=>GEO[id][0]).concat(55.752),lo=central.map(id=>GEO[id][1]).concat(37.6175);
    let a0=Math.min(...la),a1=Math.max(...la),o0=Math.min(...lo),o1=Math.max(...lo);const pa=Math.max(0.006,(0.022-(a1-a0))/2),po=Math.max(0.012,(0.04-(o1-o0))/2);
    v={lat0:a0-pa,lat1:a1+pa,lon0:o0-po,lon1:o1+po,W:360,H:360}}
  const P=projector(v);
  const f=n=>n.toFixed(1);
  const ell=(cls,lat,lon,dla,dlo)=>{const [x,y]=P.p(lat,lon);return `<ellipse class="${cls}" cx="${f(x)}" cy="${f(y)}" rx="${f(P.rx(dlo))}" ry="${f(P.ry(dla))}"/>`};
  let g=ell("m-mkad",55.745,37.6185,0.17,0.236)+ell("m-ttk",55.752,37.617,0.043,0.077)+ell("m-sad",55.7535,37.6205,0.0215,0.0385);
  const lab=(t,lat,lon,dx,dy,anchor)=>{const [x,y]=P.p(lat,lon);return `<text class="m-lbl" x="${f(x+(dx||0))}" y="${f(y+(dy||0))}" text-anchor="${anchor||"middle"}">${t}</text>`};
  if(vk==="all"){g+=lab("МКАД",55.90,37.70,0,-4);g+=lab("Садовое",55.7535,37.6205,0,P.ry(0.0215)+11)}
  else{g+=lab("Садовое кольцо",55.7535,37.6205,0,-P.ry(0.0215)-5);g+=lab("ТТК",55.795,37.617,0,0);
    const [kx,ky]=P.p(55.7520,37.6175);g+=`<rect x="${f(kx-4)}" y="${f(ky-4)}" width="8" height="8" rx="1" class="mk-ghost"/><text class="m-lbl" x="${f(kx)}" y="${f(ky+14)}" text-anchor="middle">Кремль</text>`}
  const used=new Set([...day.A.stops,...day.B.stops]);
  Object.keys(LOCS).forEach(id=>{if(used.has(id))return;const [x,y]=P.p(...GEO[id]);g+=`<circle class="mk-ghost" cx="${f(x)}" cy="${f(y)}" r="3.5"/>`});
  ["A","B"].forEach(cr=>{const pts=["start",...day[cr].stops].map(id=>P.p(...GEO[id]).map(f).join(",")).join(" ");g+=`<polyline class="r-${cr.toLowerCase()}" points="${pts}"/>`});
  const both=new Set(day.A.stops.filter(s=>day.B.stops.includes(s)));
  const named=new Set();
  ["A","B"].forEach(cr=>day[cr].stops.forEach((id,i)=>{let [x,y]=P.p(...GEO[id]);if(both.has(id))x+=cr==="A"?-8:8;
    g+=`<circle class="mk-${cr.toLowerCase()}" cx="${f(x)}" cy="${f(y)}" r="8"/><text class="mk-t" x="${f(x)}" y="${f(y)}">${i+1}</text>`;
    const show=vk==="center"?inView(v,id):!inView(VIEWS.center,id);
    if(show&&!named.has(id)){named.add(id);const [lx,ly]=P.p(...GEO[id]);const right=vk==="center"?lx<v.W-120:(id!=="svobody"&&id!=="volok");
      if(!right&&vk==="center"){g+=`<text class="m-name" x="${f(lx)}" y="${f(ly+22)}" text-anchor="middle">${SHORT[id]}</text>`}
      else{const dx=(both.has(id)?18:12)*(right?1:-1);g+=`<text class="m-name" x="${f(lx+dx)}" y="${f(ly+3.5)}" text-anchor="${right?"start":"end"}">${SHORT[id]}</text>`}}}));
  if(vk==="all"){const n=day.A.stops.concat(day.B.stops).filter(id=>inView(VIEWS.center,id));
    if(n.length){g+=`<text class="m-lbl" x="${f(P.p(55.7535,37.66)[0]+12)}" y="${f(P.p(55.7535,37.66)[1]+4)}" text-anchor="start">центр: ${new Set(n).size} ${plural(new Set(n).size,"точка","точки","точек")} → «Центр»</text>`}}
  const [hx,hy]=P.p(...GEO.start);g+=`<rect class="mk-home" x="${f(hx-7)}" y="${f(hy-7)}" width="14" height="14" rx="3"/><text class="m-name" x="${f(hx+12)}" y="${f(hy+4)}">Склад · Пришвина, 26</text>`;
  const list=cr=>`<div class="${cr.toLowerCase()}"><span class="ctag">${CREW[cr]}</span><ol>${day[cr].stops.map(id=>`<li>${esc(LOCS[id].name)}</li>`).join("")}</ol></div>`;
  document.getElementById("map").innerHTML=daysPills(di)+
    `<div class="seg" role="group" aria-label="Масштаб"><button type="button" data-mapv="all" aria-pressed="${vk==="all"}">Вся Москва</button><button type="button" data-mapv="center" aria-pressed="${vk==="center"}">Центр</button></div>
    <div class="mapbox"><svg viewBox="0 0 ${v.W} ${v.H}" role="img" aria-label="Схема маршрутов на ${day.date}">${g}</svg>
    <div class="legend"><span><i></i>Бригада А</span><span><i class="b"></i>Бригада Б</span><span><i class="h"></i>Склад</span></div></div>
    ${vk==="center"&&!central.length?`<p class="muted">В этот день точек в центре нет — смотрите «Вся Москва».</p>`:""}
    <div class="maplist">${list("A")}${list("B")}</div>
    <p class="muted">Это схема для ориентира: линии показывают порядок объезда, а не дороги. Точный путь строит навигатор во вкладке «Маршруты».</p>`;
}

    if(z.t==="pzc"){add("Крупное","Баннер круглый",1,"шт.","2 × 2,2 м, с хвоей");add("Крупное","Рама барокко 1–1,2 × 1,8 м",1,"шт.")}

    if(z.t==="tree"){add("Ели","Ель "+z.h.replace(/ \(.*\)/,""),1,"шт.",z.h.includes("(")?z.h.match(/\((.*)\)/)[1]:"");add("Ели","Подставки под ели",1,"шт.");add("Декор","Подарочные коробки",10,"шт.");add("Декор","Надписи",1,"шт.")}
    if(z.t==="street"){add("Ели","Ель уличная 2,5–3 м",2,"шт.");add("Крупное","Кашпо серое",2,"шт.");add("Декор","Гирлянда тёплая + огни-сосульки",1,"компл.","на 2 уличные ели")}
    if(z.t==="big"){add("Декор","Декор для ели 6 м",1,"компл.","шары, бусы, сосульки, кисточки, балерины, люстры, маски, пуанты, гирлянда");add("Декор","Подарочные коробки",30,"шт.");add("Декор","Надписи",1,"шт.")}
    if(z.t==="comp"){add("Декор","Настольные композиции",z.n,"шт.","20 × 20 × 20 см")}
    if(z.t==="garl"){add("Декор","Хвойная гирлянда",15,"м","лестница Неглинной");add("Декор","Шары для гирлянды",1,"компл.","золото, белый, перламутр")}
  }));
  ["Удлинители и переноски для гирлянд","Запас шаров, бус и хвои на подмену","Стяжки, проволока, ножницы, секатор","Стремянка","Плёнка и тряпки для защиты пола"].forEach(x=>add("С собой",x,0,""));
  const order=["Крупное","Ели","Декор","С собой"];
  return [...it.values()].sort((a,b)=>order.indexOf(a.grp)-order.indexOf(b.grp));
}
function renderPack(){
  const di=curDay(),day=DAYS[di];
  let h=daysPills(di);
  ["A","B"].forEach(cr=>{
    const items=packItems(di,cr);const key=x=>`pack-${di}-${cr}-${x.label}`;
    const done=items.filter(x=>get(key(x),"0")==="1").length;
    let rows="",grp="";
    items.forEach((x,i)=>{if(x.grp!==grp){grp=x.grp;rows+=`<div class="pk-g">${grp}</div>`}
      const on=get(key(x),"0")==="1";const id=`pk-${di}-${cr}-${i}`;
      rows+=`<label class="pk-row${on?" on":""}" for="${id}"><input type="checkbox" id="${id}" data-pack="${esc(key(x))}" ${on?"checked":""}><span class="t">${esc(x.label)}${x.sub?`<small>${esc(x.sub)}</small>`:""}</span><span class="q">${x.n?x.n+" "+x.unit:""}</span></label>`});
    h+=`<article class="pk ${cr.toLowerCase()}"><div class="pk-h"><span class="ctag" style="color:var(--${cr==="A"?"gold":"pine"})">${CREW[cr]}</span>
      <div class="rtitle"><h2>${day.date} · ${day[cr].title}</h2></div>${bar("Погружено",done,items.length,cr==="A"?"a":"")}</div>${rows}</article>`;
  });
  h+=`<p class="muted">Галочки сохраняются только на этом телефоне. «С собой» — наш рекомендуемый набор, его в ТЗ нет. Крепить к стенам и поверхностям по ТЗ запрещено.</p><h2>Всего по проекту</h2>`;
  document.getElementById("pack").innerHTML=h;
}

function renderList(q=""){
  const qq=q.trim().toLowerCase();
  let h=`<input type="search" id="search" placeholder="Поиск по адресу или элементу" value="${esc(q)}" autocomplete="off">`;
  const ids=Object.keys(LOCS).filter(id=>{
    if(!qq)return true; const L=LOCS[id];
    const txt=(L.name+" "+L.addr+" "+L.zones.map(z=>{const i=zoneInfo(z);return i.title+" "+z.w}).join(" ")).toLowerCase();
    return txt.includes(qq)});
  h+=`<p class="muted">${ids.length} из ${Object.keys(LOCS).length} точек (18 адресов по ТЗ: Неглинная А, Б, В — одна точка)</p>`;
  h+=`<div class="stops">`+ids.map(id=>{const L=LOCS[id],cc=count(L.zones);
    return `<details class="stop"><summary><span class="rbadge">${visits[id].map(v=>v.split(" ")[0]).filter((v,i,a)=>a.indexOf(v)===i).join(", ")}</span><div class="sname">${esc(L.name)}<div class="ssub">${shortSub(cc)}</div></div><span class="caret">›</span></summary>
    <div class="sbody" style="padding-left:12px">${chips(cc)}${zonesHtml(L)}<div class="addr">${esc(L.addr)}</div>
    <div class="actions"><a class="btn ghost" href="${mapUrl(L.addr)}" target="_blank" rel="noopener">Навигатор ↗</a></div></div></details>`}).join("")+`</div>`;
  const el=document.getElementById("list");el.innerHTML=h;
  const s=document.getElementById("search");
  s.addEventListener("input",e=>{const pos=e.target.selectionStart;renderList(e.target.value);const n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)});
}

function renderTotals(){
  const all=Object.values(LOCS).flatMap(L=>L.zones);
  const t=sum(Object.values(LOCS).map(L=>count(L.zones)));
  const pzr=all.filter(z=>z.t==="pzr").length,pzc=all.filter(z=>z.t==="pzc").length;
  const heights={};
  const add=(k,n)=>heights[k]=(heights[k]||0)+n;
  add("1,6–1,8 м · фотозоны",pzr+pzc);add("2–2,2 м · фотозоны",pzr+pzc);
  all.filter(z=>z.t==="tree").forEach(z=>add(z.h.replace(/ \(.*\)/,""),1));
  add("2,5–3 м · улица, в кашпо",2);
  const order=["0,5–0,6 м","1,6–1,8 м · фотозоны","2–2,1 м","2–2,2 м · фотозоны","2,2–2,4 м","2,3–2,5 м","2,4 м","2,5–3 м · улица, в кашпо","2,7 м","3 м"];
  const row=(k,v,s)=>`<div class="row"><div class="k">${k}${s?`<small>${s}</small>`:""}</div><div class="v">${v}</div></div>`;
  let h=`<h2>Ели</h2><div class="tbl">${order.filter(k=>heights[k]).map(k=>row(k,heights[k]+" шт.")).join("")}
    <div class="row total"><div class="k">Всего елей наших</div><div class="v">${t.trees} шт.</div></div>
    ${row("Ель 6 м заказчика","украсить","Неглинная 12В, фойе. Собирает заказчик")}</div>`;
  h+=`<h2>Фотозоны</h2><div class="tbl">
    ${row("Прямоугольные баннеры",pzr+" шт.","2,5–3 × 2,2–2,5 м, с люстрой")}
    ${row("Люстры из стекляруса",pzr+" шт.")}
    ${row("Круглые баннеры",pzc+" шт.","2 × 2,2 м")}
    ${row("Рамы барокко 0,9–1 × 1,8–2 м",pzr+" шт.","для прямоугольных")}
    ${row("Рамы барокко 1–1,2 × 1,8 м",pzc+" шт.","для круглых")}
    ${row("Подсвечники",(pzr+pzc)*3+" шт.","по 3 на фотозону")}</div>`;
  h+=`<h2>Прочее</h2><div class="tbl">
    ${row("Подарочные коробки",t.boxes+" шт.","12 × фотозона, 10 × ель, 30 × ель 6 м")}
    ${row("Настольные композиции",t.comp+" шт.","20 × 20 × 20 см")}
    ${row("Надписи (макеты на согласование)",t.text+" шт.")}
    ${row("Хвойная гирлянда",'15 м',"лестница Неглинная 12А")}
    ${row("Кашпо серые",'2 шт.',"уличные ели Неглинная 12В")}</div>
    <p class="muted">Хвоя везде: натуральная + искусственная. Фотозоны и ели 60/40 (натуральная/искусственная), композиции, ель 6 м и уличные — 30/70.</p>`;
  document.getElementById("totals").innerHTML=h;
}

function renderPlan(){
  const steps=[
    ["до 31.10","Согласования с заказчиком","Цвет фона баннеров, тексты, шрифты и цвета всех надписей. Пропуска, время заезда, разгрузка и лифты по каждому адресу — на обе бригады."],
    ["01–14.11","Закупка и производство","Баннеры, рамы, люстры, коробки, подсвечники, ели с подставками, декор, гирлянды, кашпо. Изготовление надписей по утверждённым макетам."],
    ["14–19.11","Сборка на складе","Собрать и украсить ели и композиции. Разложить комплекты по бригадам и дням, подписать короба: «21.11 · Б · Неглинная»."],
    ["19–20.11","Натуральная хвоя","Нобилис и пихту брать как можно ближе к монтажу, чтобы простояли до января."],
    ["21–22.11","Окно 1: центр и Замоскворечье","Обе бригады параллельно, выезд в 8:00 с Пришвина, 26. На каждой точке — фотоотчёт и подпись ответственного."],
    ["28–29.11","Окно 2: север, запад, область","Те же правила. Бригада А — фотозоны, бригада Б — ели и композиции."],
    ["дек – янв","Контроль","Проверка состояния натуральной хвои и гирлянд, подсушенное заменить."],
    ["16–17.01","Демонтаж, окно 1","Теми же маршрутами, погрузка в обратном порядке."],
    ["23–24.01","Демонтаж, окно 2","Закрыть акты."]
  ];
  const crews=`<div class="tbl">
    <div class="row"><div class="k">Бригада А<small>Все 12 фотозон, гирлянда на лестнице Неглинной, 16 композиций на Неглинной</small></div><div class="v">11 точек</div></div>
    <div class="row"><div class="k">Бригада Б<small>Все отдельные ели, ель 6 м заказчика, уличные ели, остальные композиции</small></div><div class="v">13 точек</div></div></div>`;
  document.getElementById("plan").innerHTML=`<h2>Кто что делает</h2>${crews}
    <h2>План действий</h2>
    <ul class="steps">${steps.map(s=>`<li class="step"><div class="when">${s[0]}</div><div><h3>${s[1]}</h3><p>${s[2]}</p></div></li>`).join("")}</ul>
    <h2>Уточнить у заказчика</h2><ol class="q"><li>Котельническая наб., 33 — с корпусом 1 или без. Пока указано без корпуса.</li></ol>`;
}

function renderStats(){
  const t=sum(Object.values(LOCS).map(L=>count(L.zones)));
  document.getElementById("stats").innerHTML=
    `<span class="stat"><b>${Object.keys(LOCS).length}</b>точек</span><span class="stat"><b>2</b>бригады</span><span class="stat"><b>4</b>дня</span>`+
    `<span class="stat"><b>${t.pz}</b>фотозон</span><span class="stat"><b>${t.trees}</b>ель</span><span class="stat"><b>${t.comp}</b>композиции</span>`;
}

document.addEventListener("change",e=>{
  if(e.target.dataset.done){const k=e.target.dataset.done;set(k,e.target.checked?"1":"0");
    renderRoutes();const d=document.querySelector(`#routes details[data-key="${k}"]`);if(d)d.open=true;}
  if(e.target.dataset.pack){set(e.target.dataset.pack,e.target.checked?"1":"0");const y=window.scrollY;renderPack();window.scrollTo(0,y);}
  if(e.target.id==="startInput"){set("start2",e.target.value||"Москва, ул. Пришвина, 26");renderRoutes();}
});
document.addEventListener("click",e=>{
  const mv=e.target.closest("[data-mapv]");if(mv){set("mapv",mv.dataset.mapv);renderMap();return}
  const b=e.target.closest("[data-day]");if(!b)return;
  set("day",b.dataset.day);renderRoutes();renderMap();renderPack();
});
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
  const show={routes:["routes"],map:["map"],pack:["pack","totals"],list:["list"],plan:["plan"]}[b.dataset.tab]||["routes"];
  ["routes","map","pack","totals","list","plan"].forEach(id=>document.getElementById(id).hidden=!show.includes(id));
  set("tab",b.dataset.tab);window.scrollTo(0,0);
}));

(function(){const t=mskYmd(new Date());const i=DAYS.findIndex(d=>d.iso===t);if(i>=0)set("day",String(i))})();
renderStats();renderRoutes();renderMap();renderPack();renderList();renderTotals();renderPlan();
setInterval(refreshProg,60000);
let savedTab=get("tab","routes");if(savedTab==="totals")savedTab="pack";const tb=document.querySelector(`.tabs button[data-tab="${savedTab}"]`);if(tb&&savedTab!=="routes")tb.click();
</script>
